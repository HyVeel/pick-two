<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pick two</title>
    <link rel="shortcut icon" href="images/icons/switch.png">
    
    <link rel="stylesheet" href="styles/lenghts.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/picktwo.css">

    <script src="scripts/picktwo.js" defer></script>
</head>

<body class="dark-theme">
    <div id="main">
        <div id="content" spellcheck="false">
            <div id="title">
                <span contenteditable text-placeholder="Title"></span>
                <img src="images/icons/edit.png">
            </div>
        
            <div id="table">
                <label id="switch-1" class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            
                <div id="text-1">
                    <span contenteditable text-placeholder="Option"></span>
                    <img src="images/icons/edit.png">
                </div>
                
                <label id="switch-2" class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            
                <div id="text-2">
                    <span contenteditable text-placeholder="Option"></span>
                    <img src="images/icons/edit.png">
                </div>
            
                <label id="switch-3" class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            
                <div id="text-3">
                    <span contenteditable text-placeholder="Option"></span>
                    <img src="images/icons/edit.png">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
