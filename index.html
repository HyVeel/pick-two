<!DOCTYPE html>

<html lang="pl-Pl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pick two</title>
    <link rel="shortcut icon" href="images/icons/switch.png">
    
    <link rel="stylesheet" href="styles/lenghts.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/picktwo.css">

    <script src="scripts/picktwo.js" defer></script>
</head>

<body class="dark-theme">
    <div id="main">
        <div id="content" spellcheck="false">
            <p id="title" contenteditable>Mieszkanie w Łodzi:</p>
        
            <div id="table">
                <label id="switch-1" class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            
                <p id="text-1" contenteditable>Niski koszt</p>
                
                <label id="switch-2" class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            
                <p id="text-2" contenteditable>Dobry stan</p>
                
                <label id="switch-3" class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            
                <p id="text-3" contenteditable>Dobra lokalizacja</p>
            </div>
        </div>
    </div>
</body>
</html>
